<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Passport Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
/* Recreation of "Cash Passport Intro v3" from its scene notes:
   Float 6.5s -> Absorb 1.3s -> Handoff 1.2s -> Phone 6.4s (loops). */
html,body{margin:0;height:100%;background:#e9e4dc;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1200px;height:675px;transform-origin:center;
  transform:translate(-50%,-50%) scale(var(--s,1));perspective:1400px}
.card,.coin,.phone{position:absolute;left:50%;top:50%;will-change:transform,opacity}
.card{width:340px;height:214px;margin:-107px 0 0 -170px;border-radius:20px;
  background:linear-gradient(135deg,#1a1a1a 0%,#3a3630 55%,#151412 100%);
  box-shadow:0 30px 50px -18px rgba(21,20,18,.55);overflow:hidden;z-index:5;
  font-family:'Outfit',sans-serif;color:#f4e6c1}
.card::before{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);
  transform:translateX(var(--sheen,-100%))}
.card b{position:absolute;left:22px;top:20px;font-size:15px;letter-spacing:.14em;font-weight:600}
.card i{position:absolute;left:22px;bottom:22px;font-style:normal;font-size:13px;letter-spacing:.2em;opacity:.8}
.card .chip{position:absolute;left:22px;top:74px;width:44px;height:34px;border-radius:7px;
  background:linear-gradient(135deg,#e8c979,#b48c3e)}
.card .mc{position:absolute;right:22px;bottom:18px;width:52px;height:32px}
.mc span{position:absolute;top:0;width:32px;height:32px;border-radius:50%}
.mc span:first-child{left:0;background:#e52523}
.mc span:last-child{right:0;background:#fcb133;mix-blend-mode:multiply}
.coin{width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;z-index:4;
  display:grid;place-items:center;font:600 26px 'Outfit',sans-serif;color:#5a4514;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),0 10px 16px -6px rgba(21,20,18,.4)}
.coin.gold{background:radial-gradient(circle at 30% 25%,#fff0b5,#e0b345 60%,#b58a22)}
.coin.silver{background:radial-gradient(circle at 30% 25%,#fff,#cfd0d2 60%,#9a9ca0);color:#4b4d52}
.phone{width:300px;height:610px;margin:-305px 0 0 -150px;border-radius:44px;background:#151412;padding:12px;
  box-shadow:0 40px 70px -25px rgba(21,20,18,.55);z-index:2}
.phone__screen{width:100%;height:100%;border-radius:34px;background:#f7f4ee;position:relative;overflow:hidden}
.phone__screen::before{content:"";position:absolute;left:50%;top:10px;width:90px;height:24px;margin-left:-45px;border-radius:14px;background:#151412}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const SC=[6.5,1.3,1.2,6.4], TOTAL=SC.reduce((a,b)=>a+b,0);
const stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const outBack=t=>{const c=1.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;

const card=document.createElement('div');card.className='card';
card.innerHTML='<b>CASH PASSPORT</b><div class="chip"></div><i>•••• •••• •••• 2026</i><div class="mc"><span></span><span></span></div>';
const phone=document.createElement('div');phone.className='phone';
phone.innerHTML='<div class="phone__screen"></div>';
stage.append(phone,card);

const SYMS=['$','€','£','¥','A$','$','€'];
const coins=SYMS.map((s,i)=>{const c=document.createElement('div');
  c.className='coin '+(i%2?'silver':'gold');c.textContent=s;
  if(s.length>1)c.style.fontSize='20px';stage.append(c);return c});

function render(t){
  t%=TOTAL;
  const a=SC[0], b=a+SC[1], c=b+SC[2];
  let cx=0,cy=0,cs=1,cr=0,cop=1,rotY=0;
  let phoneOp=0,phoneY=140,sheen=-100;

  if(t<a){                                   // Float
    const p=clamp(t/1.4);
    cy=lerp(220,0,ease(p)); cop=ease(clamp(t/.7)); cs=lerp(.85,1,ease(p));
    rotY=Math.sin(t*.7)*8;
    coins.forEach((el,i)=>{
      const st=1.2+i*.22, k=clamp((t-st)/1.1), e=outBack(clamp(k));
      const ang=(i/coins.length)*Math.PI*2-Math.PI/2+t*.12;
      const R=lerp(0,250,e), bob=Math.sin(t*1.6+i)*7;
      el.style.opacity=clamp(k*3);
      el.style.transform=`translate(${Math.cos(ang)*R}px,${Math.sin(ang)*R*.55+bob}px) scale(${lerp(.3,1,e)})`;
    });
  } else if(t<b){                            // Absorb
    const p=(t-a)/SC[1];
    coins.forEach((el,i)=>{
      const st=i*.09, k=ease(clamp((p*SC[1]-st)/.55));
      const ang=(i/coins.length)*Math.PI*2-Math.PI/2+a*.12;
      const R=lerp(250,0,k), bob=Math.sin(a*1.6+i)*7*(1-k);
      el.style.opacity=1-clamp((k-.8)*5);
      el.style.transform=`translate(${Math.cos(ang)*R}px,${Math.sin(ang)*R*.55+bob}px) scale(${lerp(1,.3,k)})`;
    });
    sheen=lerp(-100,100,p); cs=1+Math.sin(p*Math.PI)*.04;
  } else {
    coins.forEach(el=>el.style.opacity=0);
    if(t<c){                                 // Handoff: card arcs to phone
      const p=ease((t-b)/SC[2]);
      cx=lerp(0,0,p); cy=lerp(0,-40,Math.sin(p*Math.PI))+lerp(0,60,p);
      cs=lerp(1,.62,p); cr=lerp(0,-6,Math.sin(p*Math.PI));
      phoneOp=ease(clamp((t-b-.3)/.7)); phoneY=lerp(140,0,phoneOp);
    } else {                                 // Phone: idle sway + sheen
      const q=t-c;
      phoneOp=1; phoneY=0; cy=60; cs=.62;
      cr=Math.sin(q*.9)*3; rotY=Math.sin(q*.7)*10;
      sheen=lerp(-100,100,(q%3.2)/3.2);
    }
  }
  if(t<a){ phoneOp=0 }
  card.style.opacity=cop;
  card.style.transform=`translate(${cx}px,${cy}px) rotate(${cr}deg) rotateY(${rotY}deg) scale(${cs})`;
  card.style.setProperty('--sheen',sheen+'%');
  phone.style.opacity=phoneOp;
  phone.style.transform=`translateY(${phoneY}px)`;
}

function fit(){stage.style.setProperty('--s',Math.min(innerWidth/1200,innerHeight/675))}
addEventListener('resize',fit);fit();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){render(SC[0]+SC[1]+SC[2]+2)}
else{const t0=performance.now();(function loop(now){render((now-t0)/1000);requestAnimationFrame(loop)})(t0)}
window.renderAt=render;
</script>
</body>
</html>
